services:
  homelab-inventory:
    build: .
    container_name: homelab-inventory
    restart: unless-stopped
    ports:
      # 8787 is Spekarr on LimeTower — use 8788
      - "8788:8788"
    environment:
      PORT: "8788"
      DATA_ROOT: /app
      DIST_DIR: /app/web/dist
    volumes:
      # Live inventory data (edit on host or via UI save API)
      - ./inventory:/app/inventory
      - ./builds:/app/builds
      - ./archive:/app/archive
