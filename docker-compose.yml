services:
  homelab-inventory:
    build: .
    container_name: homelab-inventory
    restart: unless-stopped
    ports:
      # Host 8787 is free on LimeTower. Spekarr is container:8787 → host:8788.
      - "8787:8787"
    environment:
      PORT: "8787"
      DATA_ROOT: /app
      DIST_DIR: /app/web/dist
    volumes:
      # Live inventory data (edit on host or via UI save API)
      - ./inventory:/app/inventory
      - ./builds:/app/builds
      - ./archive:/app/archive
