# LAN-only reverse proxy for Homelab inventory
# Install on LimeTower as:
#   /mnt/user/appdata/swag/nginx/site-confs/inventory.home.conf
#
# Access: http://inventory.home:180
# (SWAG host maps container port 80 → 180)

server {
    listen 80;
    listen [::]:80;

    server_name inventory.home;

    location / {
        # Direct proxy_pass is more reliable for a LAN IP than $upstream_* vars
        proxy_pass http://192.168.0.192:8787;
        include /config/nginx/proxy.conf;
    }
}
