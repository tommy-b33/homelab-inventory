# LAN-only reverse proxy for Homelab inventory
# Install on LimeTower as:
#   /mnt/user/appdata/swag/nginx/site-confs/inventory.home.conf
#
# Why site-confs (not proxy-confs)?
#   SWAG only auto-includes *.subdomain.conf / *.subfolder.conf from proxy-confs.
#   A custom .home name belongs in site-confs.
#
# SSL: inventory.home cannot get a public Let's Encrypt cert. This is HTTP-only.
# Access on LimeTower as http://inventory.home:180 (SWAG host maps container 80 → 180).

server {
    listen 80;
    listen [::]:80;

    server_name inventory.home;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app 192.168.0.192;
        set $upstream_port 8787;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
